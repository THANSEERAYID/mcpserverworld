<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LangGraph AI Agent Architecture</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .svg-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    svg {
      max-width: 100%;
      height: auto;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="900" height="700" fill="#f9fafb" />

      <text x="450" y="40" font-family="Arial" font-size="28" text-anchor="middle" font-weight="bold" fill="#1e3a8a">
        LangGraph AI Agent Architecture
      </text>
      <text x="450" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#64748b">
        Detailed system design for LLM-powered agent with memory, tools, and orchestration
      </text>

      <!-- Client Applications -->
      <rect x="50" y="90" width="800" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
      <text x="450" y="120" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#0369a1">
        Client Applications
      </text>

      <g fill="#bae6fd" stroke="#0369a1" stroke-width="1">
        <rect x="80" y="130" width="100" height="20" rx="3" />
        <rect x="200" y="130" width="100" height="20" rx="3" />
        <rect x="320" y="130" width="100" height="20" rx="3" />
        <rect x="440" y="130" width="100" height="20" rx="3" />
        <rect x="560" y="130" width="100" height="20" rx="3" />
        <rect x="680" y="130" width="140" height="20" rx="3" />
      </g>
      <g font-family="Arial" font-size="12" text-anchor="middle">
        <text x="130" y="145">Web UI</text>
        <text x="250" y="145">Mobile App</text>
        <text x="370" y="145">Desktop Client</text>
        <text x="490" y="145">CLI</text>
        <text x="610" y="145">API Clients</text>
        <text x="750" y="145">Human-in-the-loop UI</text>
      </g>

      <!-- Orchestration Layer -->
      <rect x="50" y="180" width="800" height="280" rx="8" fill="#ecfdf5" stroke="#065f46" stroke-width="2" />
      <text x="450" y="205" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#065f46">
        LangGraph Orchestration Layer
      </text>

      <!-- State Schema -->
      <rect x="80" y="220" width="740" height="50" rx="5" fill="#d1fae5" stroke="#065f46" stroke-width="1" />
      <text x="450" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="#065f46">
        State Schema
      </text>

      <g fill="#a7f3d0" stroke="#065f46" stroke-width="1">
        <rect x="100" y="230" width="120" height="30" rx="3" />
        <rect x="230" y="230" width="100" height="30" rx="3" />
        <rect x="340" y="230" width="120" height="30" rx="3" />
        <rect x="470" y="230" width="100" height="30" rx="3" />
        <rect x="580" y="230" width="100" height="30" rx="3" />
        <rect x="690" y="230" width="100" height="30" rx="3" />
      </g>
      <g font-family="Arial" font-size="12" text-anchor="middle">
        <text x="160" y="250">conversation_history</text>
        <text x="280" y="250">current_goal</text>
        <text x="400" y="250">retrieved_memory</text>
        <text x="520" y="250">tool_results</text>
        <text x="630" y="250">user_profile</text>
        <text x="740" y="250">intermediate_steps</text>
      </g>

      <!-- Workflow -->
      <rect x="80" y="290" width="740" height="150" rx="5" fill="#d1fae5" stroke="#065f46" stroke-width="1" />
      <text x="450" y="310" font-family="Arial" font-size="16" text-anchor="middle" fill="#065f46">
        StateGraph Workflow
      </text>

      <!-- Workflow Boxes -->
      <g fill="#a7f3d0" stroke="#065f46" stroke-width="2" font-family="Arial">
        <!-- Input -->
        <rect x="100" y="330" width="100" height="80" rx="5" />
        <text x="150" y="355" font-size="12" text-anchor="middle" font-weight="bold">Input</text>
        <text x="150" y="370" font-size="12" text-anchor="middle">Processing</text>
        <text x="150" y="385" font-size="10" text-anchor="middle" fill="#065f46">Parses user input</text>
        <text x="150" y="398" font-size="10" text-anchor="middle" fill="#065f46">Updates state</text>

        <!-- Memory -->
        <rect x="220" y="330" width="100" height="80" rx="5" />
        <text x="270" y="355" font-size="12" text-anchor="middle" font-weight="bold">Memory</text>
        <text x="270" y="370" font-size="12" text-anchor="middle">Retrieval</text>
        <text x="270" y="385" font-size="10" text-anchor="middle" fill="#065f46">Vector DB lookup</text>
        <text x="270" y="398" font-size="10" text-anchor="middle" fill="#065f46">Semantic search</text>

        <!-- LLM -->
        <rect x="340" y="330" width="100" height="80" rx="5" />
        <text x="390" y="355" font-size="12" text-anchor="middle" font-weight="bold">LLM</text>
        <text x="390" y="370" font-size="12" text-anchor="middle">Planning</text>
        <text x="390" y="385" font-size="10" text-anchor="middle" fill="#065f46">Determines steps</text>
        <text x="390" y="398" font-size="10" text-anchor="middle" fill="#065f46">Selects tools</text>

        <!-- Tool -->
        <rect x="460" y="330" width="100" height="80" rx="5" />
        <text x="510" y="355" font-size="12" text-anchor="middle" font-weight="bold">Tool</text>
        <text x="510" y="370" font-size="12" text-anchor="middle">Execution</text>
        <text x="510" y="385" font-size="10" text-anchor="middle" fill="#065f46">Calls external APIs</text>
        <text x="510" y="398" font-size="10" text-anchor="middle" fill="#065f46">Uses MCP protocol</text>

        <!-- Response -->
        <rect x="580" y="330" width="100" height="80" rx="5" />
        <text x="630" y="355" font-size="12" text-anchor="middle" font-weight="bold">Response</text>
        <text x="630" y="370" font-size="12" text-anchor="middle">Generation</text>
        <text x="630" y="385" font-size="10" text-anchor="middle" fill="#065f46">Formats answer</text>
        <text x="630" y="398" font-size="10" text-anchor="middle" fill="#065f46">Updates memory</text>
      </g>
    </svg>
  </div>
</body>
</html>
